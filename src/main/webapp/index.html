<!DOCTYPE html>
<html>
<head>
    <title>Swiggy Clone</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f8f8f8;
        }

        .header {
            background: orange;
            color: white;
            padding: 20px;
            font-size: 28px;
            text-align: center;
        }

        .hero {
            text-align: center;
            padding: 60px;
        }

        .hero h1 {
            font-size: 40px;
        }

        .search {
            padding: 15px;
            width: 400px;
            font-size: 18px;
        }

        .restaurants {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }
    </style>
</head>
<body>

<div class="header">
    Swiggy Clone
</div>

<div class="hero">
    <h1>Order food online</h1>
    <input class="search" placeholder="Search for restaurants">
</div>

<div class="restaurants">
    <div class="card">
        <h3>Pizza Hut</h3>
        <p>30 mins</p>
    </div>

    <div class="card">
        <h3>KFC</h3>
        <p>25 mins</p>
    </div>

    <div class="card">
        <h3>Burger King</h3>
        <p>20 mins</p>
    </div>
</div>

</body>
</html>
